<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=400">
  <title>LegacyX Guard</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');

    :root {
      color-scheme: light;
      --primary: #ea580c;
      --primary-light: #fff7ed;
      --primary-border: #ffedd5;
      --primary-dark: #c2410c;
      --bg: #ffffff;
      --surface: #f8fafc;
      --border: #e2e8f0;
      --text: #0f172a;
      --text-muted: #64748b;
      --success: #059669;
      --success-light: #ecfdf5;
      --success-border: #a7f3d0;
      --danger: #dc2626;
      --danger-light: #fef2f2;
      --danger-border: #fecaca;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      width: 390px;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    /* Top Bar */
    .header {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #ffffff;
    }
    .brand-wrap {
      display: flex;
      align-items: center;
      gap: 9px;
    }
    .brand-icon {
      width: 26px; height: 26px;
      background: linear-gradient(135deg, #ea580c 0%, #c2410c 100%);
      border-radius: 6px;
      display: flex; align-items: center; justify-content: center;
      color: #ffffff; font-weight: 900; font-size: 12px;
      letter-spacing: -0.02em;
      box-shadow: 0 2px 6px rgba(234, 88, 12, 0.25);
    }
    .brand-title {
      font-size: 13.5px; font-weight: 800; color: var(--text); line-height: 1.15;
    }
    .brand-sub {
      font-size: 10px; color: var(--text-muted); font-weight: 500;
    }
    .status-badge {
      font-size: 10px; font-weight: 700; padding: 3px 8px;
      border-radius: 999px; text-transform: uppercase; letter-spacing: 0.03em;
      display: inline-flex; align-items: center; gap: 4px;
      transition: all 180ms ease;
    }
    .status-active {
      background: var(--success-light); color: var(--success); border: 1px solid var(--success-border);
    }
    .status-drift {
      background: var(--danger-light); color: var(--danger); border: 1px solid var(--danger-border);
      animation: pulse 1.8s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.75; }
    }

    /* Main Container */
    .container {
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    /* 4-Stat Strip */
    .stat-strip {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
    }
    .stat-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 7px 4px;
      text-align: center;
      transition: all 150ms ease;
    }
    .stat-val {
      font-size: 15px; font-weight: 800; color: var(--primary);
      font-variant-numeric: tabular-nums;
    }
    .stat-lbl {
      font-size: 8.5px; font-weight: 600; color: var(--text-muted);
      text-transform: uppercase; letter-spacing: 0.04em; margin-top: 1px;
    }

    /* Copilot Card */
    .copilot-card {
      background: #ffffff;
      border: 1px solid #fed7aa;
      border-radius: 10px;
      padding: 10px;
      box-shadow: 0 2px 8px rgba(234, 88, 12, 0.05);
      display: flex;
      flex-direction: column;
      gap: 7px;
    }
    .copilot-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .copilot-label {
      font-size: 11px; font-weight: 700; color: var(--primary-dark);
      display: flex; align-items: center; gap: 4px;
    }
    .copilot-actions {
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .btn-pill {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      font-size: 9.5px;
      font-weight: 600;
      padding: 2.5px 7px;
      border-radius: 6px;
      cursor: pointer;
      display: inline-flex; align-items: center; gap: 3px;
      transition: all 120ms;
    }
    .btn-pill:hover {
      background: var(--primary-light);
      border-color: #fdba74;
      color: var(--primary-dark);
    }
    .tag-granite {
      font-size: 8.5px; font-weight: 700;
      background: #fff7ed; color: #ea580c;
      border: 1px solid #fed7aa;
      padding: 1.5px 5px; border-radius: 4px;
    }
    .input-bar {
      display: flex;
      gap: 5px;
    }
    .copilot-input {
      flex: 1;
      padding: 7px 10px;
      border: 1.5px solid var(--border);
      border-radius: 6px;
      font-family: inherit;
      font-size: 11.5px;
      color-scheme: light !important;
      color: #0f172a !important;
      -webkit-text-fill-color: #0f172a !important;
      background-color: #ffffff !important;
      caret-color: #ea580c !important;
      resize: none;
      outline: none;
      min-height: 34px;
      max-height: 60px;
      line-height: 1.4;
      transition: border-color 150ms;
    }
    .copilot-input:focus {
      border-color: var(--primary) !important;
      background-color: #ffffff !important;
      color: #0f172a !important;
      -webkit-text-fill-color: #0f172a !important;
    }
    .copilot-input::placeholder {
      color: #94a3b8 !important;
      -webkit-text-fill-color: #94a3b8 !important;
    }
    .btn-run {
      background: var(--primary);
      border: none;
      border-radius: 6px;
      color: #ffffff;
      font-weight: 700;
      font-size: 11px;
      padding: 0 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 3px;
      transition: background 150ms;
    }
    .btn-run:hover {
      background: var(--primary-dark);
    }

    /* Prompt Chips */
    .chip-row {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
    }
    .quick-pill {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 2px 7px;
      font-size: 9px;
      font-weight: 600;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 120ms;
    }
    .quick-pill:hover {
      background: var(--primary-light);
      border-color: #fdba74;
      color: var(--primary);
    }

    /* Primary Actions */
    .action-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
    }
    .btn-act {
      padding: 8px;
      border-radius: 7px;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      transition: all 150ms;
      border: 1px solid transparent;
    }
    .btn-verify {
      background: var(--primary);
      color: #ffffff;
    }
    .btn-verify:hover {
      background: var(--primary-dark);
    }
    .btn-mutate {
      background: var(--surface);
      border-color: var(--border);
      color: var(--text);
    }
    .btn-mutate:hover {
      background: #f1f5f9;
    }
    .btn-mutate.active-drift {
      background: var(--danger-light);
      border-color: var(--danger-border);
      color: var(--danger);
    }

    /* AI Response Card */
    .ai-card {
      background: #fafaf9;
      border: 1px solid #e7e5e4;
      border-left: 3px solid var(--primary);
      border-radius: 6px;
      padding: 8px 10px;
      font-size: 11px;
      line-height: 1.45;
      color: #1c1917;
      display: none;
    }
    .ai-card-title {
      font-size: 9.5px; font-weight: 700; color: var(--primary);
      text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: 3px;
    }

    /* Scenario Replay Table */
    .scenario-card {
      background: #ffffff;
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
    }
    .scenario-head {
      background: var(--surface);
      padding: 6px 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
      font-size: 10.5px;
      font-weight: 700;
      color: var(--text-muted);
    }
    .scenario-list {
      max-height: 175px;
      overflow-y: auto;
    }
    .scenario-row {
      display: grid;
      grid-template-columns: 28px 1fr 54px 54px 50px;
      align-items: center;
      padding: 6px 10px;
      font-size: 10.5px;
      border-bottom: 1px solid #f1f5f9;
      gap: 4px;
    }
    .scenario-row:last-child {
      border-bottom: none;
    }
    .scenario-id {
      color: var(--text-muted); font-weight: 600; font-size: 9.5px;
    }
    .scenario-name {
      font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .scenario-val {
      text-align: right; font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 10px; color: var(--text-muted);
    }
    .tag-pass {
      font-size: 9px; font-weight: 700;
      background: var(--success-light); color: var(--success);
      padding: 1px 5px; border-radius: 4px; text-align: center;
    }
    .tag-drift {
      font-size: 9px; font-weight: 800;
      background: var(--danger-light); color: var(--danger);
      padding: 1px 5px; border-radius: 4px; text-align: center;
      animation: pulse 1.5s infinite;
    }

    /* Footer */
    .footer {
      padding: 8px 16px;
      background: var(--surface);
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 10px;
      color: var(--text-muted);
    }
    .footer a {
      color: var(--primary); text-decoration: none; font-weight: 600;
    }
    .footer a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <!-- Top Bar -->
  <div class="header">
    <div class="brand-wrap">
      <div class="brand-icon">LX</div>
      <div>
        <div class="brand-title">LegacyX Guard</div>
        <div class="brand-sub">IBM watsonx Granite Active</div>
      </div>
    </div>
    <div id="statusBadge" class="status-badge status-active">● 7/7 EQUIVALENT</div>
  </div>

  <div class="container">

    <!-- 4 Stats -->
    <div class="stat-strip">
      <div class="stat-card">
        <div class="stat-val">3</div>
        <div class="stat-lbl">Invariants</div>
      </div>
      <div class="stat-card">
        <div class="stat-val">7</div>
        <div class="stat-lbl">Replays</div>
      </div>
      <div class="stat-card">
        <div class="stat-val" id="driftCount">0</div>
        <div class="stat-lbl">Drift</div>
      </div>
      <div class="stat-card">
        <div class="stat-val" id="equivPct">100%</div>
        <div class="stat-lbl">Equiv.</div>
      </div>
    </div>

    <!-- Copilot Input -->
    <div class="copilot-card">
      <div class="copilot-top">
        <span class="copilot-label">✨ Assurance Copilot</span>
        <div class="copilot-actions">
          <button id="btnPinToPage" class="btn-pill" title="Keep open on page while you browse">📌 Float on Page</button>
          <button id="btnGrabSelection" class="btn-pill" title="Grab highlighted code on page">📋 Grab</button>
          <span class="tag-granite">IBM GRANITE</span>
        </div>
      </div>
      <div class="input-bar">
        <textarea id="aiPromptInput" class="copilot-input" rows="1" placeholder="Ask rule or paste code snippet..."></textarea>
        <button id="btnSubmitPrompt" class="btn-run" title="Run analysis">Run ➔</button>
      </div>
      <div class="chip-row">
        <button class="quick-pill" data-query="Explain calculateTransferFee() rules and risk score">🔍 Fee Rule</button>
        <button class="quick-pill" data-query="Why did ₹50,000 fee drop from ₹250.00 to ₹249.99 under HALF_DOWN?">⚠ ₹0.01 Drift</button>
        <button class="quick-pill" data-query="What is the blast radius of modifying FeeCalculation.java?">💥 Blast Radius</button>
        <button class="quick-pill" data-query="How does RoundingMode.HALF_UP vs HALF_DOWN affect banking calculations?">⚖ Rounding</button>
      </div>
    </div>

    <!-- Actions -->
    <div class="action-row">
      <button class="btn-act btn-verify" id="btnVerify">
        ▶ Verify Replay
      </button>
      <button class="btn-act btn-mutate" id="btnMutate">
        🧪 <span id="mutateLabel">Inject Drift</span>
      </button>
    </div>

    <!-- Live AI Output -->
    <div id="aiAnswer" class="ai-card">
      <div class="ai-card-title">✨ IBM Granite Reasoning</div>
      <div id="aiAnswerText"></div>
    </div>

    <!-- Scenario Replay Table -->
    <div class="scenario-card">
      <div class="scenario-head">
        <span>Dual-Harness Replay</span>
        <span id="replayStatus">7/7 EQUIVALENT</span>
      </div>
      <div id="scenarioBody" class="scenario-list">
        <!-- populated by popup.js -->
      </div>
    </div>

  </div>

  <!-- Footer -->
  <div class="footer">
    <span>Built with IBM Bob</span>
    <a href="https://legacyx-nine.vercel.app/" target="_blank">Open Platform →</a>
  </div>

  <script src="popup.js"></script>
</body>
</html>
